name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check tag matches version
        shell: pwsh
        run: |
          $v = python -c "import gtask_widget; print(gtask_widget.__version__)"
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG doesn't match __version__ $v" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Bundle OAuth client
        shell: pwsh
        env:
          CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if (-not $env:CLIENT_JSON) {
            throw "Repository secret GOOGLE_OAUTH_CLIENT_JSON is not set. See README > Releasing."
          }
          [IO.File]::WriteAllText("gtask_widget/_bundled_client.json", $env:CLIENT_JSON)
          python -c "import json; d = json.load(open('gtask_widget/_bundled_client.json')); assert (d.get('installed') or d)['client_id'], 'no client_id'; print('client config OK')"

      - name: Build app
        run: pyinstaller packaging/gtask_widget.spec --noconfirm

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/GTaskWidget/GTaskWidget.exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "App started and stayed up."

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Package portable zip and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/GTaskWidget -DestinationPath "dist/GTaskWidget-$env:VERSION-portable.zip"
          $files = @("dist/GTaskWidget-Setup-$env:VERSION.exe", "dist/GTaskWidget-$env:VERSION-portable.zip")
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), (Split-Path $_ -Leaf) } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py $env:VERSION notes.md
          $assets = @("dist/GTaskWidget-Setup-$env:VERSION.exe", "dist/GTaskWidget-$env:VERSION-portable.zip", "dist/SHA256SUMS.txt")
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
            gh release edit $env:TAG --notes-file notes.md
          } else {
            gh release create $env:TAG @assets --title "GTask Widget $env:VERSION" --notes-file notes.md
          }
